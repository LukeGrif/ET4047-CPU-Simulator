<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />

		<title>CPU Visual Simulator · ET4047 · University of Limerick</title>

		<link rel="icon" type="image/png" href="assets/ul-logo.png" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&display=swap" rel="stylesheet" />
		<link rel="stylesheet" href="build/app.bundle.css" />
		<link rel="stylesheet" href="ul-theme.css" />

		<script defer src="build/app.bundle.js"></script>
	</head>

	<body class="ul-app overflow-hidden">
		<header id="ul-header">
			<div class="header-top">
				<a href="https://www.ul.ie" target="_blank" rel="noopener" aria-label="University of Limerick">
					<img class="ul-logo" src="assets/ul-logo.png" alt="University of Limerick" />
				</a>
				<img class="ece-logo" src="assets/ece-logo.png" alt="Department of Electronic and Computer Engineering" />
			</div>
			<nav class="header-nav">
				<span class="course">ET4047</span>
				<span class="sep">·</span>
				<span>Embedded Software</span>
				<span class="sep">·</span>
				<span>CPU Visual Simulator</span>
				<span class="nav-links">
					<a class="nav-link" href="https://lukegrif.github.io/LAB-ET4047/">Lab Documents</a>
					<a class="nav-link" href="https://cpuvisualsimulator.github.io/" target="_blank" rel="noopener" title="Based on CPU Visual Simulator by Jonathan Cancelli">Original simulator ↗</a>
				</span>
			</nav>
		</header>
		<script>
			// Re-fit the simulator once the header's logos and fonts have loaded
			window.addEventListener("load", () => window.dispatchEvent(new Event("resize")))
			if (document.fonts) document.fonts.ready.then(() => window.dispatchEvent(new Event("resize")))
		</script>
	</body>
</html>
